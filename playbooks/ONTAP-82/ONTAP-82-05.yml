- hosts:                               "site01_ontap"
  name:                                "ONTAP-82-05 - Create Caches - Europe"
  gather_facts:                        false
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  collections:
    - netapp.ontap
  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname:                        "{{ ansible_host }}"
      username:                        "{{ ontap_admin_user }}"
      password:                        "{{ ontap_admin_password }}"
      https:                           true
      validate_certs:                  false
      use_rest:                        "always"

  pre_tasks:

  tasks:
    - name: Create write-back cache for location data
      netapp.ontap.na_ontap_flexcache:
        state:                          present
        vserver:                        "{{ item.name }}"
        name:                           "{{ item.name | replace('-','_') }}"
        origin_volume:                  "{{ item.name | replace('-','_') }}_origin"
        origin_vserver:                 "{{ item.name.split('-')[0] + '-' + item.name.split('-')[1] + '-core' }}"
        writeback:
          enabled:                      true
        relative_size:
          enabled:                      true
          percentage:                   50
        junction_path:                  "/{{ item.name | replace('gns','') | replace('-','') }}"
      loop:
        "{{ (svm_svms |
             selectattr('name', 'defined') |
             selectattr('name', 'search', 'gns-')) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - svm_svms | length > 0
        - item.name is defined
        - item.name is regex('^gns.*')

    - name: Create write-around caches for remote locations
      netapp.ontap.na_ontap_flexcache:
        state:                          present
        vserver:                        "{{ item[0].name }}"
        name:                           "{{ item[1].name | replace('-','_') }}"
        origin_volume:                  "{{ item[1].name | replace('-','_') }}_origin"
        origin_vserver:                 "{{ item[0].name.split('-')[0] + '-' + item[0].name.split('-')[1] + '-core' }}"
        writeback:
          enabled:                      false
        relative_size:
          enabled:                      true
          percentage:                   20
        junction_path:                  "/{{ item[1].name | replace('gns','') | replace('-','') }}"
      loop:
        "{{ (svm_svms |
             selectattr('name', 'defined') |
             selectattr('name', 'search', 'gns-')) |
            product(svm_svms |
                    selectattr('name', 'defined') |
                    selectattr('name', 'search', 'gns-')) |
            list }}"
      loop_control:
        label: "{{ item[0].name }} <-> {{ item[1].name }}"
      when:
        - svm_svms | length > 0
        - item[0].name is defined
        - item[1].name is defined
        - item[0].name != item[1].name
        - item[0].name is regex('^gns.*')
        - item[1].name is regex('^gns.*')

    - name: Create read-only caches for geo remote locations
      netapp.ontap.na_ontap_flexcache:
        state:                          present
        vserver:                        "{{ item[0].name }}"
        name:                           "{{ item[1].name | replace('-','_') }}"
        origin_volume:                  "{{ item[1].name | replace('-','_') }}_replica"
        origin_vserver:                 "{{ item[0].name.split('-')[0] + '-' + item[0].name.split('-')[1] + '-core' }}"
        writeback:
          enabled:                      false
        relative_size:
          enabled:                      true
          percentage:                   20
        junction_path:                  "/{{ item[1].name | replace('gns','') | replace('-','') }}"
      loop:
        "{{ (svm_svms |
             selectattr('name', 'defined') |
             selectattr('name', 'search', 'gns-')) |
            product (hostvars[groups['site03_ontap'][0]].svm_svms |
                     selectattr('name', 'defined') |
                     selectattr('name', 'search', 'gns-') |
                     list) |
            list }}"
      loop_control:
        label: "{{ item[0].name }} <-> {{ item[1].name }}"
      when:
        - svm_svms | length > 0
        - item[0].name is defined
        - item[0].name is regex('^gns.*')

  post_tasks:

