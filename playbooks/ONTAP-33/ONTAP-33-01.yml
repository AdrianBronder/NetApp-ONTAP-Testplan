- hosts:                               "ontap"
  name:                                "ONTAP-33-01 - User and Group"
  gather_facts:                        false
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  vars:
    s3_users: {}
  collections:
    - netapp.ontap
  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname:                        "{{ ansible_host }}"
      username:                        "{{ ontap_admin_user }}"
      password:                        "{{ ontap_admin_password }}"
      https:                           true
      validate_certs:                  false
      use_rest:                        "always"

  pre_tasks:

  tasks:
    - name: Create or regenerate S3 users and return access tokens
      include_tasks: Tasks-33-01.yml
      loop:
       "{{ protocols_s3_services }}"
      loop_control:
        label: "{{ item.svm.name }}"
      when:
        - protocols_s3_services | length > 0
        - item.name is defined
        - item.svm.name is regex('^ntap-svm.*')

    - name: Create S3 Groups
      netapp.ontap.na_ontap_s3_groups:
        state:                         present
        name:                          "{{ ontap_33_s3_group_name }}"
        vserver:                       "{{ item.svm.name }}"
        users:
          - name:                      "{{ ontap_33_s3_user_name }}"
        policies:
          - name:                      "{{ ontap_33_s3_group_policy }}"
      loop:
       "{{ protocols_s3_services }}"
      loop_control:
        label: "{{ item.svm.name }}"
      when:
        - protocols_s3_services | length > 0
        - item.name is defined
        - item.svm.name is regex('^ntap-svm.*')

  post_tasks:

- hosts:                               "linux_hosts"
  name:                                "ONTAP-33-01 - User and Group - Linux"
  gather_facts:                        false
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  collections:
    - ansible.windows
    - community.windows

  pre_tasks:

  tasks:
    - name: Create directory for S3 credentials
      ansible.builtin.file:
        state:                         directory
        path:                          "{{ linux_default_mount_dir }}/.s3_credentials/"

    - name: Create files
      ansible.builtin.copy:
        content:                       "{{ hostvars[item].s3_users | to_nice_json }}"
        dest:                          "{{ linux_default_mount_dir }}/.s3_credentials/{{ item }}.json"
      loop:
        "{{ groups['ontap'] }}"

  post_tasks:


- hosts:                               "windows_hosts"
  name:                                "ONTAP-33-01 - User and Group - Windows"
  gather_facts:                        false
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  collections:
    - ansible.windows
    - community.windows

  pre_tasks:

  tasks:
    - name: Create directory for S3 credentials
      ansible.windows.win_file:
        path:                          "{{ windows_default_mount_dir }}\\s3_credentials"
        state:                         directory

    - name: Remove existing credential files
      ansible.windows.win_file:
        state:                         absent
        path:                          "{{ windows_default_mount_dir }}\\s3_credentials\\{{ item }}.txt"
      loop:
        "{{ groups['ontap'] }}"

    - name: Write credentials to files
      community.windows.win_lineinfile:
        state:                         present
        path:                          "{{ windows_default_mount_dir }}\\s3_credentials\\{{ item }}.txt"
        create:                        true
        line:                          "{{ hostvars[item].s3_users | to_nice_json }}"
      loop:
        "{{ groups['ontap'] }}"

  post_tasks: