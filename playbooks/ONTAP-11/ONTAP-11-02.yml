- hosts:                               "ontap"
  name:                                "ONTAP-11-02 - Administrative Domain Authentication"
  gather_facts:                        false
  #vars_prompt:
  #  - name:                            all_ad_join_password
  #    prompt:                          "Please enter password for user domain join user: {{ all_ad_join_user }}"
  #    private:                         true
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  collections:
    - netapp.ontap
  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname:                        "{{ ansible_host }}"
      username:                        "{{ ontap_admin_user }}"
      password:                        "{{ ontap_admin_password }}"
      https:                           true
      validate_certs:                  false
      use_rest:                        "always"

  pre_tasks:
    - name: Check if any domain tunnel exists
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - security/authentication/cluster/ad-proxy
        use_python_keys:               true
      register: pre_ontap
      ignore_errors: true
      when:
        - not cluster.disaggregated
  
    - name: Show all domain tunnel svms
      ansible.builtin.debug:
        msg: "No tunnel SVM configured"
      when:
        - not cluster.disaggregated
        - pre_ontap is undefined

  tasks:
    - name: Configure Active Directory domain authentication - ASAr2
      netapp.ontap.na_ontap_restit:
        api:                           'cluster'
        method:                        'PATCH'
        body:
          active_directory:
            name:                      "{{ cluster.active_directory.name }}"
            fqdn:                      "{{ cluster.active_directory.fqdn }}"
            organizational_unit:       "{{ cluster.active_directory.organizational_unit }}"
            username:                  "{{ all_ad_join_user }}"
            password:                  "{{ all_ad_join_password }}"
      when:
        - cluster.disaggregated

    - name: Create SVM for domain tunnel (proxy) - Unified ONTAP
      netapp.ontap.na_ontap_svm:
        state:                         present
        name:                          "{{ item.name }}"
        services:
          cifs:
            allowed:                   "{{ item.cifs.allowed if not cluster.disaggregated else omit | default(omit) }}"
          ndmp:
            allowed:                   "{{ item.ndmp.allowed | default(omit) }}"
          nfs:
            allowed:                   "{{ item.nfs.allowed if not cluster.disaggregated else omit | default(omit) }}"
          fcp:
            allowed:                   "{{ item.fcp.allowed if not cluster.disaggregated else omit | default(omit) }}"
          iscsi:
            allowed:                   "{{ item.iscsi.allowed if not cluster.disaggregated else omit | default(omit) }}"
          nvme:
            allowed:                   "{{ item.nvme.allowed if not cluster.disaggregated else omit | default(omit) }}"
      loop:
        "{{ svm_svms }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - not cluster.disaggregated
        - svm_svms | length > 0
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.name is defined 
        - item.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Create network interfaces on proxy SVM - Unified ONTAP
      netapp.ontap.na_ontap_interface:
        state:                         present
        vserver:                       "{{ item.svm.name }}"
        interface_name:                "{{ item.name }}"
        home_node:                     "{{ item.location.home_node.name }}"
        home_port:                     "{{ item.location.home_port.name }}"
        address:                       "{{ item.ip.address }}"
        netmask:                       "{{ item.ip.netmask }}"
        service_policy:                "{{ item.service_policy.name | default(omit) }}"
        is_auto_revert:                "{{ item.location.auto_revert | default(omit) }}"
      loop:
        "{{ network_ip_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - not cluster.disaggregated
        - network_ip_interfaces | length > 0
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.svm.name is defined 
        - item.svm.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Configure default route on proxy SVM - Unified ONTAP
      netapp.ontap.na_ontap_net_routes:
        state:                         present
        vserver:                       "{{ item.name }}"
        destination:                   "0.0.0.0/0"
        gateway:                       "{{ all_default_gateway }}"
      loop:
        "{{ ontap_svms }}"
      when:
        - svm_svms | length > 0
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.name is defined 
        - item.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Configure DNS on proxy SVM - Unified ONTAP
      netapp.ontap.na_ontap_dns:
        state:                         present
        vserver:                       "{{ item.name }}"
        domains:                       "{{ item.dns.domains }}"
        nameservers:                   "{{ item.dns.servers }}"
      loop:
        "{{ svm_svms }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - not cluster.disaggregated
        - svm_svms | length > 0
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.name is defined 
        - item.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Create active directory preferred domain controllers - Unified ONTAP
      netapp.ontap.na_ontap_active_directory_domain_controllers:
        state:                         present
        vserver:                       "{{ item.0.key }}"
        fqdn:                          "{{ item.1.fqdn }}"
        server_ip:                     "{{ item.1.ip }}"
      loop:
        "{{ protocols_active_directory | dict2items | subelements('value.preferred-domain-controllers') }}"
      loop_control:
        label: "{{ item.0.key }}"
      when:
        - not cluster.disaggregated
        - protocols_active_directory | list | length > 0
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.0.key == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Create CIFS server on SVMs - Unified ONTAP
      netapp.ontap.na_ontap_cifs_server:
        state:                         present
        name:                          "{{ item.name }}"                  
        vserver:                       "{{ item.svm.name }}"
        service_state:                 started
        domain:                        "{{ item.ad_domain.fqdn }}"
        ou:                            "{{ item.ad_domain.organizational_unit }}"
        admin_user_name:               "{{ all_ad_join_user }}"
        admin_password:                "{{ all_ad_join_password }}"
      loop:
        "{{ protocols_cifs_services }}"
      loop_control:
        label: "{{ item.svm.name }}"
      when:
        - not cluster.disaggregated
        - protocols_cifs_services | length > 0
        - item.svm.name is defined 
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.svm.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Patch additional SVM CIFS parameters - comment - Unified ONTAP
      netapp.ontap.na_ontap_rest_cli:
        command:                       'vserver/cifs'
        verb:                          'PATCH'
        params: 
          vserver:                     "{{ item.svm.name }}"
        body:
          comment:                     "{{ item.comment }}"
      loop:
        "{{ protocols_cifs_services }}"
      loop_control:
        label: "{{ item.svm.name }}"
      when:
        - not cluster.disaggregated
        - protocols_cifs_services | length > 0
        - item.svm.name is defined
        - item.comment is defined
        - security_authentication_cluster_ad_proxy.svm.name is defined
        - item.svm.name == security_authentication_cluster_ad_proxy.svm.name
  
    - name: Create domain tunnel for cluster AD authentication - Unified ONTAP
      netapp.ontap.na_ontap_domain_tunnel:
        state:                         present
        vserver:                       "{{ security_authentication_cluster_ad_proxy.svm.name }}"
      when:
        - not cluster.disaggregated
        - security_authentication_cluster_ad_proxy.svm.name is defined

  post_tasks:
    - name: Check if any domain tunnel exists - Unified ONTAP
      netapp.ontap.na_ontap_rest_info:
        gather_subset:
          - security/authentication/cluster/ad-proxy
        use_python_keys:               true
      when:
        - not cluster.disaggregated
      register: ontap
  
    - name: Show all domain tunnel SVMs - Unified ONTAPs
      ansible.builtin.debug:
        msg: "{{ ontap.ontap_info.security_authentication_cluster_ad_proxy }}"
      when:
        - not cluster.disaggregated