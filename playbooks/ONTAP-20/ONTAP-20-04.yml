################################################################################
#
# Title:        ONTAP-20-04 - SVM Certificates
# Author:       NetApp Inc. (jont)
# Initial
# Create Date:  2025-04-08
# Description:  Basic SVM Setup
#               - SVM Certificates
# Details:      Create and install a self-signed server security certificate
#               - Create the root-ca
#               - Generate a certificate signing request
#               - Sign the request using the local root-ca
#               - install the signed certificate
#
# URLs:         https://docs.netapp.com/us-en/ontap/index.html
#               https://galaxy.ansible.com/netapp/ontap
#
# Built-in help:
# ansible-doc netapp.ontap.<module_name>
#
################################################################################

- hosts:                               "ontap"
  name:                                "ONTAP-20-05 - SVM Certificates"
  gather_facts:                        false
  vars:
    intermediate_cert: {}
  vars_files:
    - ../../vars/{{ inventory_dir | split('/') | last }}/vars.yml
    - ../../vars/{{ inventory_dir | split('/') | last }}/vault.yml
  collections:
    - netapp.ontap
  module_defaults:
    group/netapp.ontap.netapp_ontap:
      hostname:                        "{{ ansible_host }}"
      username:                        "{{ ontap_admin_user }}"
      password:                        "{{ ontap_admin_password }}"
      https:                           true
      validate_certs:                  false
      use_rest:                        "always"

  pre_tasks:

  tasks:
    - name: Create root-ca certificate
      netapp.ontap.na_ontap_security_certificates:
        state:                         present
        name:                          "{{ item.name }}"
        svm:                           "{{ item.svm.name }}"
        type:                          "{{ item.type }}"
        common_name:                   "{{ item.common_name }}"
        expiry_time:                   "{{ item.expiry_time }}"
      loop:
        "{{ security_certificates }}"
      loop_control:
        label: "Inventory SVM: {{ item.svm.name }} | Inventory Cert: {{ item.name }} "
      when:
        - security_certificates is defined
        - security_certificates | length > 0
        - item.name is defined
        - item.name is regex('^ntap-svm.*')

    - name: Generate certificate signing request (CSR)
      netapp.ontap.na_ontap_restit:
        api:                           /security/certificate-signing-request
        method:                        POST
        body:
         subject_name:                 "CN={{ item.common_name }}"
      loop:
        "{{ security_certificate_signing_request }}"
      loop_control:
        label: "Inventory SVM: {{ item.svm.name }} | Common Name: {{ item.common_name }} "
      when:
        - security_certificate_signing_request is defined
        - security_certificate_signing_request | length > 0
        - item.common_name is defined
        - item.svm.name is regex('^ntap-svm.*')
      register: csr_result

    - name: Sign certificate
      netapp.ontap.na_ontap_security_certificates:
        svm:                           "{{ item.svm.name }}"
        name:                          "{{ ( security_certificates |
                                             selectattr('common_name', 'equalto', item.common_name+'_ca' ) |
                                             first ).name }}"
        signing_request:               "{{ ( csr_result.results |
                                             selectattr('item.common_name', 'equalto', item.common_name ) |
                                             first ).response.csr }}"
        expiry_time:                   "P180DT"
      loop:
        "{{ security_certificate_signing_request }}"
      loop_control:
        label: "Inventory SVM: {{ item.svm.name }} | Common Name: {{ item.common_name }} "
      when:
        - security_certificate_signing_request is defined
        - security_certificates is defined
        - csr_result.results is defined
        - security_certificate_signing_request | length > 0
        - item.common_name is defined
        - item.svm.name is regex('^ntap-svm.*')
      register: cert_signing_result

    - name: Install Certificate
      netapp.ontap.na_ontap_security_certificates:
        common_name:                   "{{ item.common_name }}"
        svm:                           "{{ item.svm.name }}"
        type:                          server
        name:                          "{{ ( security_certificates |
                                             selectattr('common_name', 'equalto', item.common_name+'_ca' ) |
                                             first ).name }}_signed"
        public_certificate:            "{{ ( cert_signing_result.results |
                                             selectattr('item.common_name', 'equalto', item.common_name ) |
                                             first ).ontap_info.public_certificate }}"
        private_key:                   "{{ ( csr_result.results |
                                             selectattr('item.common_name', 'equalto', item.common_name ) |
                                             first ).response.generated_private_key }}"
      loop:
        "{{ security_certificate_signing_request }}"
      loop_control:
        label: "Inventory SVM: {{ item.svm.name }} | Common Name: {{ item.common_name }} "
      when:
        - security_certificate_signing_request is defined
    

  post_tasks:
