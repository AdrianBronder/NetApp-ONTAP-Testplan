# Ansible Variables

# Custom Variables

# Variables basedon ONTAP REST model
# https://<ontap_cluster_mgmt>/docs/api
cluster:
  name:                           "cluster1"
  san_optimized:                  true
  disaggregated:                  true
  active_directory:
    name:                         "cluster1"
    fqdn:                         "{{ all_ad_domain }}"
    organizational_unit:          "{{ all_storage_ad_ou_path }}"

cluster_nodes:
  - name:                         "cluster1-01"
    location:                     "Virtual DC01 | Virtual Rack 01"
  - name:                         "cluster1-02"
    location:                     "Virtual DC01 | Virtual Rack 02"

cluster_licensing_licenses: []

security_authentication_cluster_ad_proxy:
  svm:
    name:                        "{{ cluster.name }}_ad"       

network_ethernet_ports:
  - name:                         "a0a"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    type:                         "lag"
    lag:
      member_ports:
        - name:                   "e0f"
        - name:                   "e0g"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_data"
      ipspace:
        name:                     "Default"
  - name:                         "a0a"
    node:
      name:                       "{{ cluster_nodes[1].name }}"
    lag:
      member_ports:
        - name:                   "e0f"
        - name:                   "e0g"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_data"
      ipspace:
        name:                     "Default"
    type:                         "lag"
  - name:                         "a0b"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    type:                         "lag"
    lag:
      member_ports:
        - name:                   "e0d"
        - name:                   "e0e"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_peering"
      ipspace:
        name:                     "ip_peering"
  - name:                         "a0b"
    node:
      name:                       "{{ cluster_nodes[1].name }}"
    lag:
      member_ports:
        - name:                   "e0d"
        - name:                   "e0e"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_peering"
      ipspace:
        name:                     "ip_peering"
    type:                         "lag"

storage_aggregates:
  - name:                         "{{ cluster_nodes[0].name | replace('-','_') }}_aggr01"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    block_storage:
      primary:
        disk_count:               13
    snaplock_type:                "non_snaplock"
  - name:                         "{{ cluster_nodes[1].name | replace('-','_') }}_aggr01"
    node:
      name:                       "{{ cluster_nodes[1].name }}"
    block_storage:
      primary:
        disk_count:               13
    snaplock_type:                "non_snaplock"

svm_svms:
  - name:                         "ntap-svm02-san"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    ipspace:
      name:                       "Default"
    comment:                      "This is the primary SVM for SAN testing"
  - name:                         "sp-svm-bluecorp"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    auto_enable_analytics:        true
    auto_enable_activity_tracking: true
    ipspace:
      name:                       "Default"
    comment:                      "This is the BlueCorp's SVM for multi-tenancy testing"
  - name:                         "sp-svm-polarisltd"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    auto_enable_analytics:        true
    auto_enable_activity_tracking: true
    ipspace:
      name:                       "Default"
    language:                     "utf8mb4"
    comment:                      "This is the PolarisLtd's SVM for multi-tenancy testing"
  - name:                         "sp-svm-astrainc"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    auto_enable_analytics:        true
    auto_enable_activity_tracking: true
    ipspace:
      name:                       "Default"
    language:                     "utf8mb4"
    comment:                      "This is the AstraInc's SVM for multi-tenancy testing"

protocols_san_iscsi_services:
  - svm:
      name:                       "{{ svm_svms[2].name }}"
    enabled:                      true

protocols_nvme_services:
  - svm:
      name:                       "{{ svm_svms[2].name }}"
    enabled:                      true

network_ip_interfaces:
  - name:                         "ntap-svm02-san"
    scope:                        "svm"
    svm:
      name:                       "ntap-svm02-san"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.212"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[1].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-management"
  - name:                         "ntap-svm02-san_if01"
    scope:                        "svm"
    svm:
      name:                       "ntap-svm02-san"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.215"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                false
    service_policy:
      name:                       "default-data-blocks"
  - name:                         "ntap-svm02-san_if02"
    scope:                        "svm"
    svm:
      name:                       "ntap-svm02-san"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.216"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[1].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                false
    service_policy:
      name:                       "default-data-blocks"
  - name:                         "{{ cluster_nodes[0].name }}_ic01"
    scope:                        "cluster"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.121"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-intercluster"
    ipspace:
      name:                       "Default"
  - name:                         "{{ cluster_nodes[1].name }}_ic01"
    scope:                        "cluster"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.122"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[1].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-intercluster"
    ipspace:
      name:                       "Default"