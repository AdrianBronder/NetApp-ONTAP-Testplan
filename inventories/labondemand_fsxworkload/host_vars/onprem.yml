# Ansible Variables

# Custom Variables

# Variables basedon ONTAP REST model
# https://<ontap_cluster_mgmt>/docs/api
cluster:
  name:                           "onprem"

cluster_nodes:
  - name:                         "onprem-01"
    location:                     "Virtual DC01 | Virtual Rack 01"

cluster_licensing_licenses: []

security_authentication_cluster_ad_proxy:
  svm:
    name:                        "{{ cluster.name }}_ad"       

network_ethernet_ports:
  - name:                         "a0a"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    type:                         "lag"
    lag:
      member_ports:
        - name:                   "e0f"
        - name:                   "e0g"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_data"
      ipspace:
        name:                     "Default"
  - name:                         "a0a"
    node:
      name:                       "{{ cluster_nodes[1].name }}"
    lag:
      member_ports:
        - name:                   "e0f"
        - name:                   "e0g"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_data"
      ipspace:
        name:                     "Default"
    type:                         "lag"
  - name:                         "a0b"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    type:                         "lag"
    lag:
      member_ports:
        - name:                   "e0d"
        - name:                   "e0e"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_peering"
      ipspace:
        name:                     "ip_peering"
  - name:                         "a0b"
    node:
      name:                       "{{ cluster_nodes[1].name }}"
    lag:
      member_ports:
        - name:                   "e0d"
        - name:                   "e0e"
      distribution_policy:        "port"
      mode:                       "singlemode"
    broadcast_domain:
      name:                       "bc_peering"
      ipspace:
        name:                     "ip_peering"
    type:                         "lag"

storage_aggregates:
  - name:                         "{{ cluster_nodes[0].name | replace('-','_') }}_aggr01"
    node:
      name:                       "{{ cluster_nodes[0].name }}"
    block_storage:
      primary:
        disk_count:               13
    snaplock_type:                "non_snaplock"

svm_svms:
  - name:                         "{{ cluster.name }}_ad"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    ipspace:
      name:                       "Default"
    nfs:
      allowed:                    false
    cifs:
      allowed:                    true
    iscsi:
      allowed:                    false
    fcp:
      allowed:                    false
    ndmp:
      allowed:                    false
    nvme:
      allowed:                    false
    language:                     "utf8mb4"
    comment:                      "This is the tunnel SVM for cluster AD authentication"
  - name:                         "gns-us-core"
    dns:
      domains:                    "{{ all_dns_domains }}"
      servers:                    "{{ all_dns_nameservers }}"
    auto_enable_analytics:        true
    auto_enable_activity_tracking: true
    ipspace:
      name:                       "Default"
    nfs:
      allowed:                    true
    cifs:
      allowed:                    true
    iscsi:
      allowed:                    false
    fcp:
      allowed:                    false
    ndmp:
      allowed:                    false
    nvme:
      allowed:                    false
    language:                     "utf8mb4"
    comment:                      "Global Namespace with FlexCache - Europe / Berlin"

protocols_nfs_services:
  - svm:
      name:                       "gns-us-core"
    enabled:                      true
    protocol:
      v3_enabled:                 true
      v40_enabled:                true
      v41_enabled:                true
      v4_id_domain:               "demo.netapp.com"
      v3_64bit_identifiers_enabled: true
      v4_64bit_identifiers_enabled: true
    showmount_enabled:            true

protocols_active_directory:
  cluster1_ad:
    preferred-domain-controllers:
      - fqdn:                    "demo.netapp.com"
        ip:                      "192.168.0.253"
  gns-us-core:
    preferred-domain-controllers:
      - fqdn:                    "demo.netapp.com"
        ip:                      "192.168.0.253"

protocols_cifs_services:
  - name:                         "cluster1_ad"
    svm:
      name:                       "cluster1_ad"
    ad_domain:
      fqdn:                       "{{ all_ad_domain }}"
      organizational_unit:        "{{ all_storage_ad_ou_path }}"
    comment:                      "This CIFS Server is for cluster AD authentication"
    enabled:                      true
  - name:                         "gnsuscore"
    svm:
      name:                       "gns-us-core"
    ad_domain:
      fqdn:                       "{{ all_ad_domain }}"
      organizational_unit:        "{{ all_storage_ad_ou_path }}"
    comment:                      "CIFS Server Global Namespace USA / Core"
    enabled:                      true

protocols_san_iscsi_services:

protocols_nvme_services:

network_ip_interfaces:
  - name:                         "cluster1_ad"
    scope:                        "svm"
    svm:
      name:                       "cluster1_ad"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.210"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-management"
  - name:                         "{{ cluster_nodes[0].name }}_IC"
    scope:                        "cluster"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.113"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-intercluster"
    ipspace:
      name:                       "Default"
  - name:                         "gns-us-core_mgmt"
    scope:                        "svm"
    svm:
      name:                       "gns-us-core"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.151"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-management"
  - name:                         "gns-us-core"
    scope:                        "svm"
    svm:
      name:                       "gns-us-core"
    ip:
      netmask:                    "24"
      address:                    "192.168.0.155"
      family:                     "ipv4"
    location:
      home_node:
        name:                     "{{ cluster_nodes[0].name }}"
      home_port:
        name:                     "e0c"
      auto_revert:                true
    service_policy:
      name:                       "default-data-files"

cluster_peers: